<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Upcroc — Splash</title>
<link rel="stylesheet" href="shared.css">
<link rel="stylesheet" href="splash.css">
</head>
<body>
<div class="stage">
  <div class="frame-wrap">
    <div class="frame-label">Splash</div>
    <div class="phone">
      <div class="splash" id="splash">

        <div class="mark" id="mark">
          <svg viewBox="0 0 512 512" fill="none" aria-hidden="true">
            <path d="M438 146C338 108 104 164 104 258C104 352 300 408 378 370C230 330 214 182 438 146Z" fill="#F5F5F5"/>
            <circle id="ball" cx="382" cy="256" r="21" fill="#4F8DFD"/>
          </svg>
        </div>

        <span class="word up" id="up">up</span>
        <span class="word roc" id="roc">roc</span>
        <div class="tagline" id="tagline">Upwork job alerts</div>

        <div class="splash-bar"><span></span></div>
        <div class="splash-skip" id="skip">Tap to continue</div>
      </div>
    </div>
  </div>
</div>
<script src="icons.js"></script>
<script src="shared.js"></script>
<script src="splash.js"></script>
</body>
</html>
