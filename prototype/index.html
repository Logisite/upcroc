<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Upcroc — prototype</title>
<link rel="stylesheet" href="shared.css">
<style>
  .title { text-align: center; font-size: 34px; font-weight: 800; letter-spacing: -1.2px; margin-top: 48px; }
  .subtitle { text-align: center; color: var(--muted); font-size: 12px; margin-top: 7px; }
  .marks { display: flex; justify-content: center; margin: 26px 0 4px; }
  .marks .logo { width: 62px; height: 62px; color: var(--text); }
  .marks .logo svg { width: 100%; height: 100%; }
  .links { display: flex; gap: 10px; justify-content: center; margin-top: 26px; flex-wrap: wrap; }
  .links a { color: var(--text); text-decoration: none; font-weight: 700; font-size: 11px; background: var(--surface-2); padding: 12px 16px; border-radius: 10px; }
  .links a.primary { background: var(--blue); color: #fff; }
  .flow { text-align:center; color: var(--dim); font-size: 10px; margin-top: 22px; }
</style>
</head>
<body>
  <div class="marks"><div class="logo" data-logo></div></div>
  <div class="title">Upcroc</div>
  <div class="subtitle">Upwork job alerts · Android prototype</div>
  <div class="links">
    <a class="primary" href="home.html">Start at home screen</a>
    <a href="gallery.html">Live gallery</a>
    <a href="icon.html">Brand & icons</a>
    <a href="compare.html">Compare</a>
  </div>
  <div class="flow">home → splash → first run → alerts → job → search → settings → diagnostics</div>
  <script src="icons.js"></script>
  <script src="brand.js"></script>
  <script src="shared.js"></script>
</body>
</html>
