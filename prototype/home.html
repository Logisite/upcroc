<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Upcroc — Home</title>
<link rel="stylesheet" href="shared.css">
<link rel="stylesheet" href="home.css">
</head>
<body>
<div class="stage">
  <div class="frame-wrap">
    <div class="frame-label">Home screen</div>
    <div class="phone home">
      <div class="status" data-time="9:41"></div>

      <div class="home-body">
        <div class="clock">
          <div class="clock-time">9:41</div>
          <div class="clock-date">Thursday, 12 November</div>
        </div>

        <div class="widget">
          <div class="widget-top">
            <span class="i" data-icon="radar"></span>
            <span class="widget-label">Upcroc</span>
            <span class="widget-live"><i></i>Watching</span>
          </div>
          <div class="widget-count">3<span>searches on</span></div>
          <div class="widget-sub">Next check in 1m 18s · 84 alerts this week</div>
          <div class="widget-bars">
            <i class="on" style="height:38%"></i><i class="on" style="height:52%"></i><i class="on" style="height:44%"></i>
            <i class="on" style="height:70%"></i><i class="on" style="height:58%"></i><i class="on" style="height:86%"></i>
            <i class="on" style="height:64%"></i><i class="on" style="height:78%"></i><i class="on" style="height:100%"></i>
            <i style="height:46%"></i><i style="height:34%"></i><i style="height:28%"></i>
          </div>
        </div>

        <div class="apps">
          <a class="app" href="splash.html?flow=1" aria-label="Open Upcroc">
            <div class="app-tile" data-app-icon></div>
            <div class="app-name">Upcroc</div>
          </a>
          <a class="app" href="onboarding.html" aria-label="Open first-run guide">
            <div class="app-tile plain"><span class="i" data-icon="checkmark"></span></div>
            <div class="app-name">Guide</div>
          </a>
          <a class="app" href="logs.html" aria-label="Open diagnostics">
            <div class="app-tile plain"><span class="i" data-icon="logs"></span></div>
            <div class="app-name">Logs</div>
          </a>
          <a class="app" href="icon.html" aria-label="Open brand sheet">
            <div class="app-tile plain"><span class="i" data-icon="star"></span></div>
            <div class="app-name">Brand</div>
          </a>
        </div>

        <div class="app-hint">
          <div class="hint-card">
            <span class="i" data-icon="cursor"></span>
            <div><b>Tap Upcroc</b> to open the app.</div>
          </div>

        </div>
      </div>
    </div>
  </div>
</div>
<script src="icons.js"></script>
<script src="brand.js"></script>
<script src="shared.js"></script>
</body>
</html>
