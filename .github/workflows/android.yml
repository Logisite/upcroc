name: Android

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: ./gradlew :app:assembleDirectDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: upcroc-debug
          path: app/build/outputs/apk/direct/debug/app-direct-debug.apk

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Decode signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "Missing KEYSTORE_BASE64 repository secret."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upcroc-release.jks"
      - name: Build release APK
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/upcroc-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:assembleDirectRelease --no-daemon
      - name: Build update manifest
        run: |
          META=app/build/outputs/apk/direct/release/output-metadata.json
          APK=app/build/outputs/apk/direct/release/app-direct-release.apk
          VERSION_CODE=$(jq -r '.elements[0].versionCode' "$META")
          VERSION_NAME=$(jq -r '.elements[0].versionName' "$META")
          SHA=$(sha256sum "$APK" | cut -d' ' -f1)
          CHANGELOG=$(git log -1 --pretty=%s)
          cat > latest.json <<EOF
          {
            "versionCode": $VERSION_CODE,
            "versionName": "$VERSION_NAME",
            "apkUrl": "https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/app-direct-release.apk",
            "sha256": "$SHA",
            "changelog": "$CHANGELOG"
          }
          EOF
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            app/build/outputs/apk/direct/release/app-direct-release.apk \
            latest.json \
            --title "Upcroc ${GITHUB_REF_NAME#v}" \
            --generate-notes \
            --latest
