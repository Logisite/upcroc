name: Android

on:
  workflow_dispatch:
    inputs:
      release:
        description: Build and publish a signed release
        type: boolean
        default: false
      tag:
        description: Release tag, for example v0.1.0 (release only)
        type: string
        required: false
      changelog:
        description: Short changelog for latest.json (release only)
        type: string
        required: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        if: ${{ !inputs.release }}
        run: ./gradlew :app:assembleDirectDebug --no-daemon

      - uses: actions/upload-artifact@v4
        if: ${{ !inputs.release }}
        with:
          name: upcroc-debug
          path: app/build/outputs/apk/direct/debug/app-direct-debug.apk

      - name: Decode signing key
        if: ${{ inputs.release }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "Missing KEYSTORE_BASE64 repository secret."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upcroc-release.jks"

      - name: Build release APK
        if: ${{ inputs.release }}
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/upcroc-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:assembleDirectRelease --no-daemon

      - name: Build update manifest
        if: ${{ inputs.release }}
        env:
          TAG: ${{ inputs.tag }}
          CHANGELOG: ${{ inputs.changelog }}
        run: |
          if [ -z "$TAG" ]; then
            echo "A release tag is required."
            exit 1
          fi
          META=app/build/outputs/apk/direct/release/output-metadata.json
          APK=app/build/outputs/apk/direct/release/app-direct-release.apk
          VERSION_CODE=$(jq -r '.elements[0].versionCode' "$META")
          VERSION_NAME=$(jq -r '.elements[0].versionName' "$META")
          SHA=$(sha256sum "$APK" | cut -d' ' -f1)
          if [ -z "$CHANGELOG" ]; then
            CHANGELOG=$(git log -1 --pretty=%s)
          fi
          jq -n \
            --argjson versionCode "$VERSION_CODE" \
            --arg versionName "$VERSION_NAME" \
            --arg apkUrl "https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/app-direct-release.apk" \
            --arg sha256 "$SHA" \
            --arg changelog "$CHANGELOG" \
            '{versionCode: $versionCode, versionName: $versionName, apkUrl: $apkUrl, sha256: $sha256, changelog: $changelog}' \
            > latest.json

      - name: Publish release
        if: ${{ inputs.release }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          gh release create "$TAG" \
            app/build/outputs/apk/direct/release/app-direct-release.apk \
            latest.json \
            --title "Upcroc ${TAG#v}" \
            --generate-notes \
            --latest
